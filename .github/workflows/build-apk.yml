name: Build APK
on: [push, workflow_dispatch]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - run: |
       wget -q https://github.com/altessetonde43-dev/projetk11/releases/download/v1-runtime/ProjetK11-source-v17-runtime-url.zip
       unzip -o ProjetK11-source-v17-runtime-url.zip
   - uses: actions/setup-java@v4
     with: {distribution: 'temurin', java-version: '17'}
   - uses: android-actions/setup-android@v3
   - uses: gradle/gradle-build-action@v3
     with: {gradle-version: 8.5}
   - run: gradle assembleDebug
   - uses: actions/upload-artifact@v4
     with: {name: APK-14Mo, path: app/build/outputs/apk/debug/*.apk}

name: Build ProjetK11

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compiler ProjetK11
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;24.0.8215888"

      - name: Installer Gradle compatible avec AGP 8.4.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Compiler ProjetK11
        run: |
          gradle assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verifier l'APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Recuperer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjetK11-APK
          path: app/build/outputs/apk/debug/app-debug.apk

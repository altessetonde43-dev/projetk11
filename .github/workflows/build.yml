name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Repérer le projet (zip ou dossier déjà extrait)
        run: |
          if [ -f RespawnApp.zip ] && [ ! -f build.gradle ]; then
            unzip -o RespawnApp.zip -d .
            echo "PROJECT_DIR=RespawnApp" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le wrapper Gradle
        run: |
          cd $PROJECT_DIR
          [ -f gradlew ] || gradle wrapper
          chmod +x gradlew

      - name: Build APK debug
        run: |
          cd $PROJECT_DIR
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: respawn-debug-apk
          path: '**/app-debug.apk'
